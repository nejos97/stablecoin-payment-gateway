name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  rust:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Run unit tests
        run: cargo test -p domain -p wallet -p config -p jobs -p auth

      - name: Build release binary
        run: cargo build --release -p gateway
