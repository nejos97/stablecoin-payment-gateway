[workspace]
resolver = "2"
members = [
    "crates/config",
    "crates/domain",
    "crates/wallet",
    "crates/db",
    "crates/chain",
    "crates/jobs",
    "crates/api",
    "crates/gateway",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
authors = ["Jonathan Nenba"]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
base58 = "0.2"
bs58 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
hex = "0.4"
hmac = "0.12"
http = "1"
k256 = { version = "0.13", features = ["ecdsa"] }
pbkdf2 = "0.12"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust_decimal = { version = "1", features = ["serde-with-str", "serde-float"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "rust_decimal", "uuid", "json", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
bip39 = "2"
ed25519-dalek = "2"
tiny-hderive = "0.3"
solana-sdk = "2.1"
spl-associated-token-account = { version = "6", features = ["no-entrypoint"] }
spl-token = { version = "7", features = ["no-entrypoint"] }

config = { path = "crates/config" }
domain = { path = "crates/domain" }
wallet = { path = "crates/wallet" }
db = { path = "crates/db" }
chain = { path = "crates/chain" }
jobs = { path = "crates/jobs" }
api = { path = "crates/api" }
