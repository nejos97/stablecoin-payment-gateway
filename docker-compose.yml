services:
  postgres:
    image: postgres:16-alpine
    container_name: stablecoin-payment-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stablecoin_payment
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d stablecoin_payment']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: stablecoin-payment-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PORT: ${PORT:-3000}
    container_name: stablecoin-payment-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/stablecoin_payment
      REDIS_URL: redis://redis:6379
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: apps/dashboard
      dockerfile: Dockerfile
    container_name: stablecoin-payment-dashboard
    restart: unless-stopped
    environment:
      API_URL: http://api:${PORT:-3000}
    ports:
      - "${DASHBOARD_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
